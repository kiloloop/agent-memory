[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-cli"
dynamic = ["version"]
description = "Cross-session memory for coding agents: plain files, git-native, no server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Kiloloop" },
]
dependencies = []
keywords = ["agents", "memory", "markdown", "git"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/kiloloop/agent-memory"
Source = "https://github.com/kiloloop/agent-memory"
Changelog = "https://github.com/kiloloop/agent-memory/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.16,<0.17",
  "twine>=7,<8",
]

[project.scripts]
agent-memory = "agent_memory.cli:main"

[tool.hatch.version]
path = "src/agent_memory/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/Makefile",
  "/README.md",
  "/scripts",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
